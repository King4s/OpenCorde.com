name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencorde
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d opencorde"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opencorde
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-openmls-vendor.py
      - run: rustup component add clippy
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: cargo install sqlx-cli --no-default-features --features postgres --locked
      - run: sqlx migrate run
        working-directory: crates/opencorde-db
      - run: cargo test --workspace --locked
      - name: E2EE PostgreSQL regression
        env:
          OPENCORDE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: cargo test -p opencorde-api --lib routes::e2ee --locked -- --include-ignored
      - run: cargo clippy --workspace --locked -- -D warnings

  frontend:
    name: Frontend (type-check + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: client
      - run: pnpm test:e2ee
        working-directory: client
      - run: pnpm check
        working-directory: client
      - run: pnpm lint
        working-directory: client

  tauri-check:
    name: Tauri build check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './client/src-tauri -> target'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev pkg-config gnome-keyring libsecret-tools dbus-x11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: client
      - run: pnpm build
        working-directory: client
      - run: cargo check --locked
        working-directory: client/src-tauri
      - run: cargo test --test crypto_ipc --locked
        working-directory: client/src-tauri
      - name: Native recovery with OS credential storage
        run: bash ../../scripts/test-native-keyring.sh
        working-directory: client/src-tauri
