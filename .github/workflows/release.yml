name: Release

# Trigger on version tags (v0.1.0, v1.2.3, etc.) or manual dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build unsigned manual installers as workflow artifacts only'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write   # needed to create GitHub release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ''
            manual_args: '--bundles deb,appimage'
            artifact: linux-amd64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-amd64
          - platform: windows-latest
            args: ''
            artifact: windows-amd64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate

      - name: Install project Rust toolchain
        run: rustc --version

      - name: Install macOS cross-compilation targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './client/src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            pkg-config

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure unsigned manual installers
        if: inputs.dry_run == true
        working-directory: client
        run: node -e "require('fs').writeFileSync('src-tauri/tauri.manual.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Build manual installers
        if: inputs.dry_run == true
        working-directory: client
        run: pnpm tauri build --ci --no-sign --config src-tauri/tauri.manual.conf.json ${{ matrix.args }} ${{ matrix.manual_args }} -- --locked

      - name: Upload manual installers
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            client/src-tauri/target/**/release/bundle/**/*.deb
            client/src-tauri/target/**/release/bundle/**/*.AppImage
            client/src-tauri/target/**/release/bundle/**/*.dmg
            client/src-tauri/target/**/release/bundle/**/*.msi
            client/src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Build and release Tauri app
        if: inputs.dry_run != true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — set in repo secrets for signed builds)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri update signing (optional)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenCorde ${{ github.ref_name }}'
          releaseBody: 'See the CHANGELOG for release notes. The app connects to opencorde.com by default — change the server URL in Settings to point at your own instance.'
          releaseDraft: ${{ inputs.dry_run == true }}
          prerelease: false
          args: ${{ matrix.args }}
